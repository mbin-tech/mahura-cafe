var logEl = document.getElementById('status');

function log(msg, cls) {
    var color = cls || 'info';
    logEl.innerHTML += '<div class="' + color + '">' + msg + '</div>';
    logEl.scrollTop = logEl.scrollHeight;
}

async function startImport() {
    document.getElementById('importBtn').disabled = true;
    logEl.innerHTML = '';
    log('🚀 شروع ایمپورت...');

    // پاک کردن جدول قبلی
    log('🗑️ حذف آیتم‌های قبلی...');
    var delResult = await db.from('menu_items').delete().neq('id', 0);
    if (delResult.error) {
        log('خطا در حذف: ' + delResult.error.message, 'error');
        document.getElementById('importBtn').disabled = false;
        return;
    }
    log('✅ جدول خالی شد');

    // تبدیل آیتم‌ها به فرمت Supabase
    var rows = menuData.map(function(item) {
        return {
            name: item.name,
            price: item.price,
            price2: item.price2 || null,
            size1: item.size1 || null,
            size2: item.size2 || null,
            description: item.desc || '',
            en: item.en || '',
            category: item.category,
            img: item.img || ''
        };
    });

    log('📤 در حال آپلود ' + rows.length + ' آیتم...');
    var result = await db.from('menu_items').insert(rows);

    if (result.error) {
        log('❌ خطا: ' + result.error.message, 'error');
        document.getElementById('importBtn').disabled = false;
        return;
    }

    log('✅ ' + rows.length + ' آیتم با موفقیت اضافه شد!', 'success');
    log('🎉 تمام! حالا پنل مدیریت رو رفرش کن', 'success');
    document.getElementById('importBtn').disabled = false;
}

async function checkCount() {
    logEl.innerHTML = '';
    log('🔍 در حال شمارش...');
    var result = await db.from('menu_items').select('id', { count: 'exact', head: true });
    if (result.error) {
        log('❌ خطا: ' + result.error.message, 'error');
        return;
    }
    log('📊 تعداد آیتم‌های فعلی: ' + result.count, 'success');
}
